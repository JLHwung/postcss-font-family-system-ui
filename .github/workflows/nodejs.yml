name: Node CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs of the same pull request, let pushes to main finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Not `latest`: it can resolve to a Node.js pre-release (alpha).
          node-version: lts/*
          cache: "yarn"
      - name: Check Yarn dedupe
        run: yarn dedupe --check
      - name: Install dependencies
        run: yarn install --immutable
      - name: Lint
        run: yarn check
      - name: Build
        run: yarn build
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundled
          path: dist

  test:
    name: Test (Node.js ${{ matrix.node-version }}, ${{ matrix.os }})
    needs: check-and-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 20
            os: ubuntu-latest
          - node-version: 22
            os: ubuntu-latest
          - node-version: 24
            os: ubuntu-latest
          - node-version: 26
            os: ubuntu-latest
          - node-version: 26
            os: windows-latest
          - node-version: 26
            os: macos-latest
          # `latest` can resolve to a Node.js pre-release (alpha), so this job
          # is an early warning only and must not fail the workflow.
          - node-version: latest
            os: ubuntu-latest
            experimental: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Get test dependencies versions
        id: test-dep-versions
        shell: bash # $GITHUB_OUTPUT needs bash syntax, Windows defaults to pwsh
        run: |
          echo "postcss-tape=$(node scripts/get-dev-deps postcss-tape)" >> "$GITHUB_OUTPUT"
          echo "postcss=$(node scripts/get-dev-deps postcss)" >> "$GITHUB_OUTPUT"
      # One command per step: on Windows (pwsh) only the last command's exit
      # code fails a multi-line step.
      - name: Install production dependencies
        run: yarn workspaces focus -A --production
      - name: Install test dependencies
        run: yarn add --dev postcss-tape@${{ steps.test-dep-versions.outputs.postcss-tape }} postcss@${{ steps.test-dep-versions.outputs.postcss }}
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundled
          path: dist
      - name: Test
        run: yarn test:tape
