name: Publish

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Not `latest`: it can resolve to a Node.js pre-release (alpha).
          node-version: lts/*
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # release builds never restore a cache
      - name: Check tag matches package version
        run: |
          test "$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Install
        run: yarn install --immutable
      - name: Lint
        run: yarn check
      - name: Build
        run: yarn build
      - name: Test
        run: yarn test:tape
      - name: Stage publish
        # The package is already built and tested above, so skip prepublishOnly.
        # Authentication uses the trusted publisher configured on npmjs.com,
        # no NPM_TOKEN is needed. The staged version is released only after a
        # maintainer approves it with 2FA, via `npm stage approve <stage-id>`
        # or on npmjs.com.
        run: npm stage publish --ignore-scripts
